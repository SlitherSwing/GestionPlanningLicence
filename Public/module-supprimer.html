
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Module: suppression</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    

</head>
<body>
   
    <a href="#"></a>
    
  <!-- Contenu global -->
<div class="Delete-Draw">

    <!-- Fenêtre principale de suppression -->
    <div class="Delete-Modal">

        <!-- En-tête de la modale -->
        <div class="Delete-Header">

            <!-- Icône croix -->
            <div class="Delete-Icon">
                <img src="assets/Croix.svg" class="Cross">
            </div>

            <!-- Titre et sous-titre de la modale -->
            <div class="Delete-Title">
                <h3>Supprimer le module</h3>
                <p>Confirmation de l'action</p>
            </div>

            <!-- Bouton pour fermer la modale -->
            <div class="Delete-Close">
                <img src="assets/Croix2.svg" class="Cross2">
            </div>

        </div>

        <!-- Contenu du message d’avertissement -->
        <div class="Delete-Content">

            <!-- Texte expliquant la conséquence de la suppression -->
            <p>
                Vous vous apprêtez à supprimer le module, <br>
                cette action est irrévocable. </br>
                A noter qu’aucune intervention ne doit être liée à ce module
                pour pouvoir le <br> supprimer. </br>
            </p>

            <!-- Question de confirmation -->
            <p class="Delete-Question">
                Confirmez-vous l’action ?
            </p>

        </div>

        <!-- Boutons d’action utilisateur -->
        <div class="Delete-Actions">

            <!-- Bouton pour annuler la suppression -->
            <button class="Cancel">Annuler</button>

            <!-- Bouton pour confirmer la suppression -->
            <button class="Confirm">Confirmer</button>

        </div>

    </div>

</div>
</body>
</html>
