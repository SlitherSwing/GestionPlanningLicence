<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Corps Enseignant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>
</head>
<body>
    <nav class="Breadcrumb">
        <ol>
            <li><a href=""><span class="material-symbols-outlined">home</span></a></li>
            <li>></li>
            <li><a href="">Corps enseignant</a></li>
        </ol>
    </nav>
    <div class="Main">
        <div class="Heading">
            <h2>Corps enseignant</h2>
            <button>Ajouter un enseignant</button>
        </div>
        <div class="Content">
            <div class="Filters">
                <p>Filtres</p>
                <div>
                    <form method="post">
                        <div>
                            <label for="Name">Nom de famille</label>
                            <input id="Name" type="search" placeholder="Saisissez le nom de famille" name="Name">
                        </div>
                        <div>
                            <label for="First-Name">Prénom</label>
                            <input id="First-Name" type="search" placeholder="Saisissez le prénom" name="First-Name">
                        </div>
                        <div>
                            <label for="Email">Email</label>
                            <input id="Email" type="email" placeholder="Saisissez l'email" name="Email">
                        </div>
                        <div>
                            <label for="Submit"></label>
                            <input id="Submit" type="submit" value="Filtrer">
                        </div>
                    </form>
                </div>
            </div>
            <div class="Table">
                <p>Template</p>
                <table>
                    <tr class="Table-Head">
                        <th>Nom de famille</th>
                        <th>Prénom</th>
                        <th>Modules enseignés</th>
                        <th>Nombre d'heures</th>
                    </tr>
                    <tr>
                        <th>Template</th>
                        <th>Template</th>
                        <th>Template</th>
                        <th><span class="material-symbols-outlined">visibility</span>Template</th>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
