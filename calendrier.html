<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calendrier - Interventions</title>
        <link rel="stylesheet" href="css/calen-inter.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    </head>
    <body>
        <section class="page">

            <div class="gauche"></div>


            <div class="droite">

                <section class="haut">

                    <div class="maison"> <img src="images/maison.png"></div>
                    <div class="maison-texte"><p>> Calendrier </p></div>

                </section>
                <hr class="ligne">

                <section class="calendrier-titre">

                    <div class="cal-int">
                        <p class="cal">Calendrier</p>
                        <p class="int">Interventions de la semaine </p>
                    </div>

                    <div class="bouton-ajt">
                        <button class="ajouter"> Ajouter une nouvelle intervenion</button>
                    </div>

                </section>

                <section class="infos-inter">

                    <div class="date">
                        <p>Date de l'intervention</p>
                    </div>

                    <div class="date">
                        <p>Module & titre</p>
                    </div>

                    <div class="date">
                        <p>Type</p>
                    </div>

                    <div class="date">
                        <p>Intervenants</p>
                    </div>

                    <div class="date">
                        <p>En visio</p>
                    </div>

                </section>

            </div>

        </section>
